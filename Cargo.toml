[workspace]
members = [
    "programs/*"
]
# tests-litesvm is deliberately NOT a member — it's a separate, standalone
# Cargo workspace (own Cargo.lock) so its litesvm/solana-* dev-dependency
# versions can never again affect this workspace's resolved graph, which
# `anchor build`'s IDL-generation step apparently draws on beyond what a
# bare `cargo build-sbf` would. Without this exclude, Cargo would error
# ("current package believes it's in a workspace when it's not") the moment
# anyone runs a cargo command inside tests-litesvm/, since it auto-discovers
# this ancestor [workspace] by directory nesting regardless of the members glob.
exclude = ["tests-litesvm"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
