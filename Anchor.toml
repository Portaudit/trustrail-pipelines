skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
trustrail_pipelines = "CgXidrtsV5nLkjPCYhZUPUuZUpmvekMKvDN9uh3ucoC8"
mock_swap = "3qqN3ZXc1SPEtDLdn9Ek68r9YtDc1mBVgdhS7r48d9vJ"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# tests-litesvm is a separate, standalone Cargo workspace (see root
# Cargo.toml's [workspace] exclude) — its own Cargo.lock, isolated from
# this one so litesvm's dev-dependencies can't affect `anchor build` again.
# Requires target/deploy/trustrail_pipelines.so to already exist, i.e. run
# `anchor build` first.
test = "cargo test --manifest-path tests-litesvm/Cargo.toml"

[hooks]
